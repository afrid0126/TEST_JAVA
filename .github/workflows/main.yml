
name: Java CI Auto-Heal Pipeline

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build-and-test:
    # Do not run CI again for an AI-generated repair commit.
    if: ${{ !contains(github.event.head_commit.message, '[AI-AGENT]') }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run Maven Tests
        run: mvn test

      - name: Trigger Autonomous AI Agent on Failure
        if: failure()
        env:
          AGENT_WEBHOOK_URL: ${{ secrets.AGENT_WEBHOOK_URL }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          TEAM_NAME: CODE_WARRIORS
          LEADER_NAME: AFRID
          BRANCH_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "Maven failed. Triggering AI repair agent..."

          curl --fail-with-body --retry 3 \
            -X POST "$AGENT_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg repo_url "$REPO_URL" \
              --arg team_name "$TEAM_NAME" \
              --arg leader_name "$LEADER_NAME" \
              --arg branch "$BRANCH_NAME" \
              --arg run_id "$RUN_ID" \
              '{
                repo_url: $repo_url,
                team_name: $team_name,
                leader_name: $leader_name,
                branch: $branch,
                run_id: $run_id
              }')"
